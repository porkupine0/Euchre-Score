<title>Euchre Scorekeeper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600;700&display=swap" crossorigin>
<style>
:root{
  --bg:#eef4f3; --surface:#ffffff; --surface-2:#dfeae8; --ink:#11211f; --muted:#556866; --line:#cddbd9;
  --accent:#0e7c7b; --accent-ink:#ffffff; --ta:#0e7c7b; --tb:#c2410c; --red:#c0263a;
  --lead:#e1f3f1; --good:#1f7a4d; --err:#b3261e; --err-bg:#fdeceb;
  --shadow:0 1px 2px rgba(17,33,31,.06),0 6px 18px rgba(17,33,31,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0b1514; --surface:#12201f; --surface-2:#1b2d2b; --ink:#e9f3f2; --muted:#98b0ad; --line:#274240;
  --accent:#4fd1c5; --accent-ink:#0b1514; --ta:#4fd1c5; --tb:#fb923c; --red:#ff7a8a;
  --lead:#123532; --good:#5fd39a; --err:#f28b82; --err-bg:#3b1e1c;
  --shadow:none;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0b1514; --surface:#12201f; --surface-2:#1b2d2b; --ink:#e9f3f2; --muted:#98b0ad; --line:#274240;
  --accent:#4fd1c5; --accent-ink:#0b1514; --ta:#4fd1c5; --tb:#fb923c; --red:#ff7a8a;
  --lead:#123532; --good:#5fd39a; --err:#f28b82; --err-bg:#3b1e1c;
  --shadow:none;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 "Figtree",system-ui,sans-serif;padding-inline:16px;padding-block:18px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif;margin:0;text-wrap:balance}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:19px;font-weight:600}
.num{font-variant-numeric:tabular-nums}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px}
.logo svg{width:38px;height:38px;flex:none}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}

.score{font-family:"Bricolage Grotesque",sans-serif;font-size:44px;font-weight:800;line-height:1}

.strip{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:14px;background:var(--surface-2)}

.push{border:2px solid var(--accent);border-radius:14px;padding:14px 16px;background:var(--surface)}
.push .big{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:22px;text-wrap:balance}

/* entry */
.step{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.step:last-of-type{border-bottom:0}
.stephead{display:flex;align-items:baseline;gap:8px}
.stephead .t{font-weight:800}

.outcome{padding:14px;border-radius:12px;background:var(--lead);display:flex;flex-direction:column;gap:2px}

/* history */
.hcard{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}

.hcard .what small{display:block;color:var(--muted);font-size:13px}
.hcard .pts{font-weight:800;text-align:right;white-space:nowrap}
.badge{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:999px;background:var(--surface-2);margin-left:4px;vertical-align:1px}
.badge.eu{background:var(--err-bg);color:var(--err)}
.badge.mr{background:var(--lead);color:var(--accent)}

/* stats */
.hl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.aw{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);display:flex;flex-direction:column;gap:2px}
.aw .an{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:800}
.aw .ah{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:18px;overflow-wrap:anywhere}

.stwrap{overflow-x:auto}

table.st th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
table.st th:first-child,table.st td:first-child{text-align:left}
@media (max-width:380px){.hl{grid-template-columns:1fr}}

.banner{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.banner h2{font-size:26px;font-weight:800}
.banner button{background:var(--surface);color:var(--ink);border-color:var(--surface)}
details.rules{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
details.rules summary{cursor:pointer;font-weight:700}
.rulegrid{display:grid;grid-template-columns:1fr auto;gap:6px 16px;font-size:14px;margin-top:10px}
.rulegrid dt{color:var(--muted)} .rulegrid dd{margin:0;font-weight:700;text-align:right}
.rulelist{font-size:14px;margin:10px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px}

/* how to play */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tab{padding:9px 6px;border-radius:10px;font-size:15px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.guide h3{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif;font-size:16px;font-weight:800;color:var(--accent);margin:0}
.guide section{display:flex;flex-direction:column;gap:6px}
.guide p,.guide li{font-size:15px;line-height:1.55;max-width:65ch}

.guide ul,.guide ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.rtable{display:grid;grid-template-columns:1fr auto;gap:5px 14px;font-size:15px;margin:0}
.rtable dt{color:var(--ink)} .rtable dd{margin:0;font-weight:800;color:var(--accent);text-align:right}
.example{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:4px}

<body>

<div class="wrap" id="app"></div>

<script>
const KEY = "euchre-scorekeeper-v1";
const LOGO = `<svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="var(--accent)"/><rect x="28" y="18" width="44" height="64" rx="7" fill="var(--accent-ink)"/><text x="50" y="62" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="36" fill="var(--accent)">J</text></svg>`;
const SUITS = [{s:"♠",n:"Spades"},{s:"♥",n:"Hearts",r:true},{s:"♦",n:"Diamonds",r:true},{s:"♣",n:"Clubs"}];
const suitHtml = i => SUITS[i].r ? `<span class="red">${SUITS[i].s}</span>` : SUITS[i].s;

const blankSetup = () => ({ teams:[{name:"",p:["",""]},{name:"",p:["",""]}], firstDealer:0, target:10 });
let state = load() || { phase:"setup", setup:blankSetup(), teams:[], target:10, dealer0:0, hands:[], tab:"game" };
if (!state.tab) state.tab = "game";
let entry = null;
let confirmKey = null, confirmTimer = null;

function load(){ try{ const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const plural = (n, w) => `${n} ${w}${n===1?"":"s"}`;

// Seats go around the table: A1, B1, A2, B2. Partners sit across.
const teamOf = p => p % 2;
const tcls = t => t === 0 ? "a" : "b";
function tName(teams, t){ return (teams[t].name||"").trim() || (t===0 ? "Us" : "Them"); }
function pName(teams, p){ const t = teams[teamOf(p)], k = Math.floor(p/2); return (t.p[k]||"").trim() || `${tName(teams,teamOf(p))} ${k+1}`; }
const P = p => esc(pName(state.teams, p));
const T = t => esc(tName(state.teams, t));
const verb = t => /s$/i.test(tName(state.teams,t)) || tName(state.teams,t).includes("&") ? "" : "s";
const dealerOf = h => (state.dealer0 + h) % 4;

// Standard scoring
function scoreHand(h){
  const makers = teamOf(h.caller), defenders = 1 - makers;
  if (h.tricks >= 3){
    const march = h.tricks === 5;
    const pts = march ? (h.alone ? 4 : 2) : 1;
    return { team: makers, pts, kind: march ? "march" : "made", makers };
  }
  return { team: defenders, pts: 2, kind: "euchre", makers };
}
function totals(k){
  const t = [0,0];
  state.hands.slice(0, k ?? state.hands.length).forEach(h => { const s = scoreHand(h); t[s.team] += s.pts; });
  return t;
}
function winner(t){ const i = t.findIndex(v => v >= state.target); return i >= 0 ? i : null; }

function confirmThen(key, fn){
  if (confirmKey === key){ clearTimeout(confirmTimer); confirmKey = null; fn(); return; }
  confirmKey = key; render();
  clearTimeout(confirmTimer);
  confirmTimer = setTimeout(()=>{ confirmKey = null; render(); }, 3500);
}
let wakeLock = null;
async function keepAwake(){
  try{ if (state.phase === "play" && "wakeLock" in navigator && document.visibilityState === "visible" && !wakeLock){
    wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", ()=>{ wakeLock = null; });
  }}catch(e){ wakeLock = null; }
}
document.addEventListener("visibilitychange", keepAwake);

function render(){
  const app = document.getElementById("app");
  const focusId = document.activeElement && document.activeElement.id;
  app.innerHTML = state.tab === "guide" ? header() + guideView() : state.phase === "setup" ? setupView() : playView();
  if (focusId){ const el = document.getElementById(focusId); if (el) el.focus({preventScroll:true}); }
}
function header(extra=""){ return `<div class="brand"><div class="logo">${LOGO}<h1>Euchre</h1></div><div class="hx-hbtns">${hx.button()}${extra}</div></div>
  <div class="tabs" role="tablist"><button class="tab" role="tab" id="tab-game" data-act="tab" data-v="game" aria-selected="${state.tab==="game"}">Game</button><button class="tab" role="tab" id="tab-guide" data-act="tab" data-v="guide" aria-selected="${state.tab==="guide"}">How to play</button></div>`; }

function guideView(){
  const target = (state.phase === "play" ? state.target : state.setup.target) || 10;
  const H = `<span class="red">♥</span>`, D = `<span class="red">♦</span>`;
  return `<div class="panel guide">
    <section><h2>The idea</h2><p>Euchre is a fast partnership trick-taking game played with a short deck. Each hand, one team picks trump and has to take at least 3 of the 5 tricks. If they don't, they're <b>euchred</b> and the other team scores.</p></section>
    <section><h3>What you need</h3><ul><li>4 players in two teams of 2. Partners sit across from each other.</li><li>A 24-card deck: the 9, 10, Jack, Queen, King and Ace of each suit. Pull them out of a regular deck.</li></ul></section>
    <section><h3>1. The deal</h3><p>The dealer gives everyone 5 cards, in batches of 2 and 3. The 4 leftover cards go face down in the middle, and the top one is turned face up. The deal passes to the left after every hand.</p></section>
    <section><h3>2. Picking trump</h3>
      <ol><li><b>Round 1:</b> starting left of the dealer, each player either passes or tells the dealer to pick up the face-up card. That makes its suit trump. The dealer adds the card to their hand and discards one face down.</li>
      <li><b>Round 2:</b> if everyone passes, turn the card face down. Starting left of the dealer again, each player can name any other suit as trump, or pass.</li>
      <li>If everyone passes twice, throw the hand in. The next player deals.</li></ol>
      <p>The team that picked trump are the <b>makers</b> and need 3 tricks. The other team are the defenders.</p>
      <p><b>Going alone:</b> whoever picks trump can say “alone.” Their partner lays their cards face down and sits out the hand. It's harder, but a sweep pays double.</p></section>
    <section><h3>3. Which cards win</h3>
      <p>In the trump suit, from highest to lowest:</p>
      <ol><li><b>Right bower:</b> the Jack of trump.</li><li><b>Left bower:</b> the other Jack of the same color. It counts as a trump, not as its own suit.</li><li>Ace, King, Queen, 10, 9.</li></ol>
      <p>In the other suits: Ace, King, Queen, Jack, 10, 9.</p>
      <div class="example"><span><b>Example:</b> hearts are trump. The J${H} is the highest card, then the J${D}, then the A${H}. The J${D} is a heart for this hand, so it has to follow when hearts are led.</span></div></section>
    <section><h3>4. Playing tricks</h3>
      <ul><li>The player left of the dealer leads the first trick.</li>
      <li>Going left, everyone plays one card. You must follow the suit that was led if you can. If you can't, play anything, including a trump.</li>
      <li>The highest trump wins the trick. If no trump was played, the highest card of the suit led wins. The winner leads the next trick.</li>
      <li>Play all 5 tricks.</li></ul></section>
    <section><h3>5. Scoring</h3>
      <dl class="rtable">
        <dt>Makers take 3 or 4 tricks</dt><dd>1</dd>
        <dt>Makers take all 5 (a <b>march</b>)</dt><dd>2</dd>
        <dt>Going alone, take 3 or 4</dt><dd>1</dd>
        <dt>Going alone, take all 5</dt><dd>4</dd>
        <dt>Makers take 2 or fewer (<b>euchred</b>): defenders get</dt><dd>2</dd>
      </dl></section>
    <section><h3>6. Winning</h3><p>The first team to ${target} points wins.</p></section>
    <section><h3>Strategy tips</h3>
      <ul><li>Two bowers, or a bower and the Ace of trump, is usually enough to pick trump.</li>
      <li>Ordering up a card to the other team's dealer gives them an extra trump. Be sure you're strong.</li>
      <li>In round 2, the player left of the dealer often names the suit of the same color as the turned-down card. It's called <b>next</b>, and it's a classic call.</li>
      <li>When your team picked trump, lead trump early to pull out the other team's trumps.</li>
      <li>Think about going alone with both bowers and the Ace of trump, or with three high trumps and an outside Ace.</li>
      <li>Don't trump a trick your partner is already winning.</li></ul></section>
    <section><h3>Using this app</h3>
      <ol><li>Enter both teams, pick who deals first, and choose how many points to play to.</li>
      <li>After each hand, tap Score hand. Tap who picked trump, whether they went alone, and how many tricks their team took. The trump suit is optional, for stats.</li>
      <li>The app scores it: made, a march, or euchred.</li>
      <li>Tap a hand number to fix a mistake.</li></ol></section>
    <section><h3>Glossary</h3>
      <ul><li><b>Makers:</b> the team that picked trump.</li>
      <li><b>Euchre:</b> stopping the makers from taking 3 tricks. It's worth 2 to the defenders.</li>
      <li><b>March:</b> taking all 5 tricks.</li>
      <li><b>Bowers:</b> the two Jacks of the trump color. Right is the Jack of trump, left is its twin.</li>
      <li><b>Order up:</b> telling the dealer to pick up the face-up card in round 1.</li>
      <li><b>Kitty:</b> the 4 cards left over after the deal.</li></ul></section>
  </div>`;
}

function rulesCard(open){
  return `<details class="rules" ${open?"open":""}><summary>How scoring works</summary>
    <dl class="rulegrid">
      <dt>Team that called trump takes 3 or 4 tricks</dt><dd>1</dd>
      <dt>Takes all 5 tricks (a march)</dt><dd>2</dd>
      <dt>Goes alone and takes 3 or 4</dt><dd>1</dd>
      <dt>Goes alone and takes all 5</dt><dd>4</dd>
      <dt>Takes 2 or fewer (euchred): the other team gets</dt><dd>2</dd>
    </dl>
    <ul class="rulelist">
      <li>Each hand has 5 tricks. Whichever team picks trump is "the makers", and they need at least 3 tricks.</li>
      <li>The deck is 9 through Ace. The Jack of trump (right bower) is the highest card, then the other Jack of the same color (left bower).</li>
      <li>Going alone means the caller's partner sits out that hand, for a bigger payoff.</li>
      <li>First team to ${state.target || 10} wins.</li>
    </ul></details>`;
}

function setupView(){
  const su = state.setup, dt = su.teams;
  const teamBlock = t => `<div class="teamset">
    <label class="lbl" for="tname-${t}"><span class="dot ${tcls(t)}"></span>Team ${t+1}</label>
    <input type="text" id="tname-${t}" data-tname="${t}" placeholder="${t===0?"Us":"Them"}" value="${esc(dt[t].name)}" maxlength="18" autocomplete="off">
    <div class="pair">
      <input type="text" id="p-${t}-0" data-p="${t}-0" placeholder="Partner 1" value="${esc(dt[t].p[0])}" maxlength="14" autocomplete="off" aria-label="Team ${t+1} partner 1">
      <input type="text" id="p-${t}-1" data-p="${t}-1" placeholder="Partner 2" value="${esc(dt[t].p[1])}" maxlength="14" autocomplete="off" aria-label="Team ${t+1} partner 2">
    </div></div>`;
  const opts = [0,1,2,3].map(p=>`<option value="${p}" ${p===su.firstDealer?"selected":""}>${esc(pName(dt,p))}</option>`).join("");
  return header() + `
  <div class="panel">
    <div class="eyebrow">Two teams of two</div>
    ${teamBlock(0)}${teamBlock(1)}
    <div class="teamset">
      <label class="lbl" for="first-dealer">First dealer</label>
      <select id="first-dealer">${opts}</select>
      <p class="hint" id="seathint">Partners sit across from each other, so seats go ${[0,1,2,3].map(p=>esc(pName(dt,p))).join(", ")}.</p>
    </div>
    <div class="row"><span class="grow" style="font-weight:600">Play to</span>
      <div class="opts">${[5,10,11].map(v=>`<button class="opt" id="tg-${v}" data-act="target" data-v="${v}" aria-pressed="${su.target===v}">${v}</button>`).join("")}</div></div>
  </div>
  <button class="primary" data-act="start" id="start">Start game</button>` + rulesCard(true);
}

function playView(){
  const t = totals(), n = state.hands.length, has = n > 0, win = winner(t);
  let top = "";
  if (win != null){
    top = `<div class="banner"><div class="eyebrow" style="color:inherit;opacity:.85">Game over · ${plural(n,"hand")}</div>
      <h2>${T(win)} win${verb(win)} ${t[win]} to ${t[1-win]}</h2>
      <div>${P(win)} &amp; ${P(win+2)} take it.</div>
      ${hx.saved()}
      <div class="btnrow"><button data-act="rematch" id="rematch">Rematch</button><button data-act="newsetup" id="newsetup2">New teams</button></div></div>`;
  } else if (has){
    const close = [0,1].filter(i => state.target - t[i] <= 2);
    if (close.length) top = `<div class="push"><div class="eyebrow" style="color:var(--accent)">Closing in</div><div class="big num">${close.map(i=>`${T(i)} need${verb(i)} ${state.target - t[i]}`).join(" · ")}</div></div>`;
  }
  const teams = [0,1].map(i => {
    const lead = has && t[i] > t[1-i];
    const gap = !has ? "" : t[0] === t[1] ? "All square" : lead ? `Leads by ${t[i]-t[1-i]}` : `${t[1-i]-t[i]} behind`;
    const pips = Array.from({length:state.target},(_,k)=>`<span class="pip ${k<t[i]?"on":""}"></span>`).join("");
    return `<div class="team ${tcls(i)} ${lead?"lead":""}">
      <div class="tname ${i===0?"ta":"tb"}">${T(i)}</div>
      <div class="tplayers">${P(i)} &amp; ${P(i+2)}</div>
      <div class="score num">${t[i]}</div>
      <div class="pips" aria-hidden="true">${pips}</div>
      ${gap?`<div class="gap num">${gap}${win==null&&state.target-t[i]>0?` · needs ${state.target-t[i]}`:""}</div>`:""}
    </div>`;
  }).join("");

  let handBlock = "";
  const hIdx = entry && entry.editing != null ? entry.editing : n;
  if (win == null || entry){
    const d = dealerOf(hIdx);
    handBlock = `<div class="strip"><span class="eyebrow">Hand ${hIdx+1}</span>
      <span class="big">${P(d)} deals</span>
      <span class="hint">${P((d+1)%4)} leads first and gets the first chance to call trump.</span></div>`;
    handBlock += entry ? entryView(hIdx) : `<button class="primary" data-act="newHand" id="newHand">Score hand ${n+1}</button>`;
  }

  let history = "";
  if (has){
    const run = [0,0];
    const rows = state.hands.map((h,hi) => {
      const s = scoreHand(h); run[s.team] += s.pts;
      const badge = s.kind === "euchre" ? `<span class="badge eu">Euchred</span>` : s.kind === "march" ? `<span class="badge mr">March</span>` : "";
      return `<div class="hcard"><button class="small" id="edit-${hi}" data-act="edit" data-i="${hi}" aria-label="Edit hand ${hi+1}">${hi+1}</button>
        <div class="what">${P(h.caller)} called ${h.suit!=null?suitHtml(h.suit):"trump"}${h.alone?" alone":""} ${badge}
          <small>${T(s.makers)} took ${plural(h.tricks,"trick")} · ${run[0]}–${run[1]}</small></div>
        <div class="pts ${s.team===0?"ta":"tb"} num">${T(s.team)} +${s.pts}</div></div>`;
    }).reverse().join("");
    history = `<div class="panel">
      <div class="row"><h2 class="grow">Hands</h2><button class="small" data-act="undo" id="undo">${confirmKey==="undo"?"Tap to confirm":"Undo last"}</button></div>
      <div>${rows}</div><p class="hint">Newest first. Tap a hand number to fix it.</p></div>` + statsView();
  }

  const reset = `<button class="small ghost" data-act="newgame" id="newgame">${confirmKey==="new"?"Tap to confirm":"New game"}</button>`;
  return header(reset) + top + `<div class="teams">${teams}</div>` + handBlock + history + rulesCard(false) +
    `<p class="hint">Every game is saved in History on this device, and the screen stays on while you play.</p>`;
}

function entryView(hIdx){
  const e = entry;
  let outcome = "";
  if (e.caller != null && e.tricks != null){
    const s = scoreHand(e);
    outcome = s.kind === "euchre"
      ? `<div class="outcome euchre"><span class="big">Euchred!</span><span>${T(s.team)} get${verb(s.team)} 2 points.</span></div>`
      : `<div class="outcome"><span class="big">${s.kind==="march"?"A march!":"Made it"}</span><span>${T(s.team)} get${verb(s.team)} ${plural(s.pts,"point")}.</span></div>`;
  }
  const makers = e.caller != null ? teamOf(e.caller) : null;
  return `<div class="panel">
    <div class="row"><h2 class="grow">${e.editing!=null?"Edit hand":"Hand"} ${hIdx+1}</h2><button class="small ghost" data-act="cancel" id="cancel">Cancel</button></div>
    <div>
      <div class="step"><div class="stephead"><span class="t">Who called trump?</span></div>
        <div class="chips">${[0,1,2,3].map(p=>`<button class="chip" id="caller-${p}" data-act="caller" data-i="${p}" aria-pressed="${e.caller===p}"><span class="dot ${tcls(teamOf(p))}"></span>${P(p)}</button>`).join("")}</div></div>
      <div class="step"><div class="stephead"><span class="t">Trump suit</span><span class="s">optional, for stats</span></div>
        <div class="chips">${SUITS.map((s,i)=>`<button class="chip suit" id="suit-${i}" data-act="suit" data-i="${i}" aria-pressed="${e.suit===i}" aria-label="${s.n}">${suitHtml(i)}</button>`).join("")}</div></div>
      <div class="step"><div class="stephead"><span class="t">Did they go alone?</span></div>
        <div class="chips"><button class="chip" id="alone-no" data-act="alone" data-v="0" aria-pressed="${!e.alone}">No, with partner</button><button class="chip" id="alone-yes" data-act="alone" data-v="1" aria-pressed="${!!e.alone}">Yes, alone</button></div></div>
      <div class="step"><div class="stephead"><span class="t">Tricks ${makers!=null?`${T(makers)}`:"the calling team"} took</span></div>
        <div class="grid6">${[0,1,2,3,4,5].map(v=>`<button id="tricks-${v}" data-act="tricks" data-v="${v}" aria-pressed="${e.tricks===v}">${v}</button>`).join("")}</div></div>
    </div>
    ${outcome}
    ${e.error?`<div class="err">${esc(e.error)}</div>`:""}
    <button class="primary" data-act="saveHand" id="saveHand">${e.editing!=null?"Save changes":"Post hand "+(hIdx+1)}</button>
    ${e.editing!=null?`<button class="danger" data-act="delHand" id="delHand">${confirmKey==="del"?"Tap again to delete hand "+(hIdx+1):"Delete this hand"}</button>`:""}
  </div>`;
}

function statsView(){
  const H = state.hands, n = H.length;
  const calls = [0,0,0,0], made = [0,0,0,0], alone = [0,0,0,0], aloneWon = [0,0,0,0];
  const tWon = [0,0], tCalls = [0,0], tMade = [0,0], euchres = [0,0], marches = [0,0], suits = [0,0,0,0];
  H.forEach(h => { const s = scoreHand(h), m = s.makers;
    calls[h.caller]++; tCalls[m]++; tWon[s.team]++;
    if (s.kind !== "euchre"){ made[h.caller]++; tMade[m]++; } else euchres[s.team]++;
    if (s.kind === "march") marches[m]++;
    if (h.alone){ alone[h.caller]++; if (s.kind === "march") aloneWon[h.caller]++; }
    if (h.suit != null) suits[h.suit]++; });
  const top = arr => { const m = Math.max(...arr); return { m, who: arr.map((v,i)=>i).filter(i=>arr[i]===m) }; };
  const aw = (a,b,c) => `<div class="aw"><span class="an">${a}</span><span class="ah">${b}</span><span class="ad">${c}</span></div>`;
  const eu = top(euchres), mr = top(marches), cl = top(calls), lw = top(aloneWon), fs = top(suits);
  const tn = idx => idx.map(T).join(", "), pn = idx => idx.map(P).join(", ");
  const rate = (a,b) => b ? Math.round(100*a/b)+"%" : "–";
  return `<div class="panel"><h2>Stats</h2><div class="hl">
    ${aw("Euchre masters", eu.m?tn(eu.who):"Nobody yet", eu.m?`Euchred the other team ${plural(eu.m,"time")}`:"No euchres yet")}
    ${aw("March madness", mr.m?tn(mr.who):"Nobody yet", mr.m?`Took all 5 tricks ${plural(mr.m,"time")}`:"No marches yet")}
    ${aw("Trump caller", pn(cl.who), `Called trump ${plural(cl.m,"time")}`)}
    ${lw.m?aw("Lone wolf", pn(lw.who), `Swept a hand alone ${plural(lw.m,"time")}`):aw("Favorite trump", fs.m?fs.who.map(suitHtml).join(" "):"–", fs.m?`Called ${plural(fs.m,"time")}`:"Tap a suit when scoring to track it")}
  </div>
  ${`<div class="stwrap"><table class="st"><thead><tr><th></th><th>${T(0)}</th><th>${T(1)}</th></tr></thead><tbody>
    <tr><td>Hands won</td><td>${tWon[0]}</td><td>${tWon[1]}</td></tr>
    <tr><td>Called trump</td><td>${tCalls[0]}</td><td>${tCalls[1]}</td></tr>
    <tr><td>Made the call</td><td>${rate(tMade[0],tCalls[0])}</td><td>${rate(tMade[1],tCalls[1])}</td></tr>
    <tr><td>Euchres</td><td>${euchres[0]}</td><td>${euchres[1]}</td></tr>
    <tr><td>Marches</td><td>${marches[0]}</td><td>${marches[1]}</td></tr></tbody></table></div>`}
  <div class="stwrap"><table class="st"><thead><tr><th>Player</th><th>Called</th><th>Made</th><th>Alone</th><th>Alone sweeps</th></tr></thead><tbody>
    ${[0,1,2,3].map(p=>`<tr><td><span class="dot ${tcls(teamOf(p))}"></span>${P(p)}</td><td>${calls[p]}</td><td>${made[p]}</td><td>${alone[p]}</td><td>${aloneWon[p]}</td></tr>`).join("")}</tbody></table></div>
  </div>`;
}

function openEntry(editIdx){
  if (editIdx != null){ const h = state.hands[editIdx]; entry = { ...h, editing:editIdx, error:"" }; }
  else entry = { caller:null, suit:null, alone:false, tricks:null, editing:null, error:"" };
  render();
  const c = document.getElementById("cancel"); if (c) c.scrollIntoView({block:"start", behavior:"smooth"});
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, su = state.setup;
  switch(act){
    case "target": su.target = +b.dataset.v; save(); render(); break;
    case "tab": state.tab = b.dataset.v; save(); render(); window.scrollTo(0,0); break;
    case "start": {
      state.teams = su.teams.map((t,i)=>({ name: t.name.trim() || (i===0?"Us":"Them"), p: t.p.map(x=>x.trim()) }));
      state.teams.forEach(t => t.p = t.p.map((x,k)=> x || `${t.name} ${k+1}`));
      state.target = su.target; state.dealer0 = su.firstDealer; state.hands = []; state.phase = "play"; entry = null;
      save(); render(); keepAwake(); window.scrollTo({top:0}); break;
    }
    case "newHand": openEntry(null); break;
    case "edit": openEntry(+b.dataset.i); break;
    case "cancel": entry = null; render(); break;
    case "caller": entry.caller = +b.dataset.i; entry.error = ""; render(); break;
    case "suit": entry.suit = entry.suit === +b.dataset.i ? null : +b.dataset.i; render(); break;
    case "alone": entry.alone = b.dataset.v === "1"; render(); break;
    case "tricks": entry.tricks = +b.dataset.v; entry.error = ""; render(); break;
    case "saveHand": {
      if (entry.caller == null){ entry.error = "Tap who called trump."; render(); break; }
      if (entry.tricks == null){ entry.error = "Tap how many tricks the calling team took."; render(); break; }
      const h = { caller:entry.caller, suit:entry.suit, alone:!!entry.alone, tricks:entry.tricks };
      if (entry.editing != null) state.hands[entry.editing] = h; else state.hands.push(h);
      entry = null; save(); render(); window.scrollTo({top:0, behavior:"smooth"}); break;
    }
    case "delHand": confirmThen("del", ()=>{ state.hands.splice(entry.editing,1); entry = null; save(); render(); }); break;
    case "undo": confirmThen("undo", ()=>{ state.hands.pop(); entry = null; save(); render(); }); break;
    case "rematch": state.hands = []; state.dealer0 = (state.dealer0 + 1) % 4; entry = null; save(); render(); break;
    case "newsetup": state.phase = "setup"; state.hands = []; entry = null; save(); render(); break;
    case "newgame": confirmThen("new", ()=>{ state.phase = "setup"; state.hands = []; entry = null; save(); render(); }); break;
  }
});
document.addEventListener("input", e => {

document.addEventListener("change", e => { if (e.target.id === "first-dealer"){ state.setup.firstDealer = +e.target.value; save(); } });

/* hx:js:start */
// History adapter: how a Euchre game looks to the shared history module.
const HX = {
  app: "euchre", title: "Euchre", unit: ["hand", "hands"], sideWord: "team", lowWins: false,
  // unnamed seats: teams are "Us" / "Them", partners "<team name> 1" / "<team name> 2"
  guest: n => /^(us|them)$|^.+ [12]$/i.test(String(n).trim()),
  current(){
    if (state.phase !== "play" || !Array.isArray(state.hands) || !state.hands.length) return null;
    const T = state.teams, H = state.hands, S = H.map(scoreHand), t = totals(), win = winner(t);
    const count = f => [0,1].map(i => S.reduce((a, s, k) => a + (f(s, H[k], i) ? 1 : 0), 0));
    return {
      sides: [0,1].map(i => ({ name: tName(T,i), players: [pName(T,i), pName(T,i+2)] })),
      rounds: S.map(s => [0,1].map(i => s.team === i ? s.pts : 0)),   // one team scores each hand
      done: win != null, winners: win != null ? [win] : undefined,
      labels: H.map((h,k) => `${k+1} · ${pName(T,h.caller)}${SUITS[h.suit] ? " " + SUITS[h.suit].s : ""}${h.alone ? " alone" : ""}`),
      note: `to ${state.target}`,
      extra: {
        calls: count((s,h,i) => s.makers === i), made: count((s,h,i) => s.makers === i && s.kind !== "euchre"),
        euchres: count((s,h,i) => s.kind === "euchre" && s.team === i), marches: count((s,h,i) => s.kind === "march" && s.makers === i),
        alone: count((s,h,i) => h.alone && s.makers === i),
        raw: JSON.parse(JSON.stringify({ teams: T, target: state.target, dealer0: state.dealer0, hands: H }))
      }
    };
  },
  detail(g){
    const x = g.extra; if (!x || !Array.isArray(x.calls)) return "";
    const nm = i => { const s = g.sides[i] || { name: "", players: [] }; return esc(HX.guest(s.name) || !s.name ? s.players.join(" & ") : s.name); };
    const line = i => `${nm(i)} called trump ${plural(x.calls[i], "time")} and made ${x.made[i]}` +
      (x.euchres[i] ? `, ${plural(x.euchres[i], "euchre")}` : "") +
      (x.marches[i] ? `, ${x.marches[i]} march${x.marches[i] === 1 ? "" : "es"}` : "") +
      (x.alone[i] ? `, went alone ${plural(x.alone[i], "time")}` : "");
    return `<p class="hint">Next to each hand number: who called trump.</p><p class="hint">${g.sides.map((_, i) => line(i)).join(" · ")}</p>`;
  },
  records(done){
    const rows = [];
    done.forEach(g => { const x = g.extra; if (!x || !Array.isArray(x.euchres)) return;
      g.sides.forEach((s,i) => rows.push({ g, s, euchres: x.euchres[i] || 0, marches: (x.marches || [])[i] || 0 })); });
    if (!rows.length) return [];
    // same wording as the module's own records: "Sharks (Sam & Alex)", or just the partners when the team name is a default
    const label = s => HX.guest(s.name) || !s.name ? (s.players.some(p => !HX.guest(p)) ? s.players.join(" & ") : s.name || "Team") : `${s.name} (${s.players.join(" & ")})`;
    const top = f => { const m = Math.max(...rows.map(r => r[f])); return { m, who: rows.filter(r => r[f] === m) }; };
    const names = w => [...new Set(w.map(r => label(r.s)))].slice(0,3).join(", ");
    const when = w => w.length === 1 ? new Date(w[0].g.date).toLocaleDateString(undefined, { month:"short", day:"numeric", year:"numeric" }) : `${w.length} times`;
    const out = [], eu = top("euchres"), mr = top("marches");
    if (eu.m) out.push(["Most euchres in a game", names(eu.who), `${eu.m} · ${when(eu.who)}`]);
    if (mr.m) out.push(["Most marches in a game", names(mr.who), `${mr.m} · ${when(mr.who)}`]);
    return out;
  }
};
/* ---------- game history (shared module, same in every score app) ----------
   Every game with at least one scored round is saved to localStorage as it's played, with its date,
   the teams or players, every round's scores, the final totals and the winner. A "History" screen shows
   all-time records by player name, a game log with full scorecards, and backup / restore.
   The app supplies an adapter, HX (defined just above), and this module wraps the app's save() and render(). */
const hx = (() => {
  const HKEY = HX.app + "-history-v1", BKEY = HX.app + "-last-backup";
  const unitOne = (HX.unit || ["round", "rounds"])[0], unitMany = (HX.unit || ["round", "rounds"])[1];
  const ui = { open: false, range: "all", sel: null, game: null, all: false, msg: "", confirm: null, timer: 0 };
  const e = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const num = n => (n < 0 ? "−" : "") + Math.abs(n).toLocaleString("en-US");
  const plural = (n, w, ws) => `${n} ${n === 1 ? w : (ws || w + "s")}`;
  const pkey = n => String(n || "").trim().replace(/\s+/g, " ").toLowerCase();
  const guest = n => !pkey(n) || (HX.guest ? HX.guest(n) : /^(player|partner|team|side|seat) \d+$/i.test(String(n).trim()));
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const whenTxt = iso => { const d = new Date(iso); return isNaN(d) ? "Unknown date" : d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) + " · " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }); };
  const dayTxt = iso => { const d = new Date(iso); return isNaN(d) ? "Unknown date" : d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }); };

  // ----- storage -----
  const valid = g => !!g && typeof g.id === "string" && Array.isArray(g.sides) && g.sides.length >= 1 && g.sides.every(s => s && typeof s.name === "string" && Array.isArray(s.players))
    && Array.isArray(g.rounds) && g.rounds.every(r => Array.isArray(r) && r.length === g.sides.length && r.every(v => typeof v === "number" && isFinite(v)));
  function load() { try { const a = JSON.parse(localStorage.getItem(HKEY) || "[]"); return Array.isArray(a) ? a.filter(valid) : []; } catch (err) { return []; } }
  let games = load();
  function persist() { try { localStorage.setItem(HKEY, JSON.stringify(games)); } catch (err) { /* storage full or blocked */ } }
  const totalsOf = g => Array.isArray(g.totals) && g.totals.length === g.sides.length ? g.totals : g.sides.map((_, i) => g.rounds.reduce((s, r) => s + r[i], 0));
  function winnersOf(g) {
    if (Array.isArray(g.winners) && g.winners.length) return g.winners;
    const t = totalsOf(g), best = g.lowWins ? Math.min(...t) : Math.max(...t);
    return t.map((_, i) => i).filter(i => t[i] === best);
  }
  const isDone = g => !!g.done;

  // ----- keep the archive in step with the current game -----
  // A game is saved as soon as its first round is scored. Starting a new game (or undoing back to nothing)
  // detaches it; a game undone to nothing after one round is dropped, anything longer stays as unfinished.
  function sync() {
    if (typeof state !== "object" || !state) return;
    let cur = null;
    try { cur = HX.current(); } catch (err) { cur = null; }
    const has = cur && Array.isArray(cur.rounds) && cur.rounds.length > 0;
    const k = state.hxId ? games.findIndex(g => g.id === state.hxId) : -1;
    if (has) {
      if (!state.hxId) state.hxId = newId();
      const prev = k >= 0 ? games[k] : null;
      const g = {
        id: state.hxId, date: prev ? prev.date : new Date().toISOString(), updated: new Date().toISOString(),
        sides: cur.sides.map(s => ({ name: String(s.name || ""), players: (s.players || []).map(String) })),
        rounds: cur.rounds.map(r => r.map(v => +v || 0)),
        totals: (cur.totals || null) && cur.totals.map(v => +v || 0),
        done: !!cur.done, winners: cur.done && Array.isArray(cur.winners) ? cur.winners.slice() : undefined,
        lowWins: !!(cur.lowWins != null ? cur.lowWins : HX.lowWins), note: cur.note || "", labels: cur.labels || undefined, extra: cur.extra || undefined
      };
      if (!g.totals) delete g.totals;
      const before = prev ? JSON.stringify(Object.assign({}, prev, { updated: 0 })) : "";
      if (before === JSON.stringify(Object.assign({}, g, { updated: 0 }))) return;
      if (k >= 0) games[k] = g; else games.push(g);
      persist();
    } else if (state.hxId) {
      // games with no game-over of their own end when the app says so (New game): the best total wins
      let ended = false;
      try { ended = typeof HX.ended === "function" && !!HX.ended(); } catch (err) { ended = false; }
      if (k >= 0 && !games[k].done && ended) {
        const g = games[k], t = g.totals || g.sides.map((_, i) => g.rounds.reduce((a, r) => a + (+r[i] || 0), 0));
        const best = g.lowWins ? Math.min(...t) : Math.max(...t);
        g.done = true; g.winners = t.map((_, i) => i).filter(i => t[i] === best); g.updated = new Date().toISOString();
        persist();
      } else if (k >= 0 && !games[k].done && games[k].rounds.length <= 1) { games.splice(k, 1); persist(); }
      state.hxId = null;
    }
  }

  // ----- stats -----
  const byDate = () => games.slice().sort((a, b) => String(a.date).localeCompare(String(b.date)));
  function inRange(g) {
    if (ui.range === "all") return true;
    const d = new Date(g.date);
    if (isNaN(d)) return false;
    if (ui.range[0] === "y") return d.getFullYear() === +ui.range.slice(1);
    return Date.now() - d <= +ui.range.slice(1) * 864e5;
  }
  const rangeLabel = () => ui.range === "all" ? "all time" : ui.range[0] === "y" ? ui.range.slice(1) : `the last ${ui.range.slice(1)} days`;
  function sideLabel(s) {
    const named = s.players.filter(p => !guest(p));
    if (s.players.length > 1) return guest(s.name) || !s.name ? (named.length ? s.players.join(" & ") : s.name || "Team") : `${s.name} (${s.players.join(" & ")})`;
    return s.players[0] || s.name;
  }
  function shortLabel(s) {
    if (s.players.length > 1) return guest(s.name) || !s.name ? s.players.join(" & ") : s.name;
    return s.players[0] || s.name;
  }
  function career(list) {
    const map = new Map(), pairs = new Map();
    list.filter(isDone).forEach(g => {
      const t = totalsOf(g), w = winnersOf(g);
      g.sides.forEach((s, i) => {
        const won = w.includes(i);
        s.players.forEach(name => {
          if (guest(name)) return;
          const k = pkey(name);
          let p = map.get(k);
          if (!p) { p = { k, name: "", gp: 0, wins: 0, shared: 0, sum: 0, best: null, worst: null, streak: 0, bestStreak: 0 }; map.set(k, p); }
          p.name = String(name).trim();
          p.gp++; p.sum += t[i];
          const better = (a, b) => g.lowWins ? a < b : a > b;
          if (p.best == null || better(t[i], p.best)) p.best = t[i];
          if (p.worst == null || better(p.worst, t[i])) p.worst = t[i];
          if (won) { p.wins++; if (w.length > 1) p.shared++; p.streak++; p.bestStreak = Math.max(p.bestStreak, p.streak); } else p.streak = 0;
        });
        const named = s.players.filter(n => !guest(n));
        if (s.players.length === 2 && named.length === 2) {
          const pk = named.map(pkey).sort().join("|");
          const r = pairs.get(pk) || { names: named.map(n => String(n).trim()).sort((a, b) => a.localeCompare(b)), gp: 0, wins: 0 };
          r.gp++; if (won) r.wins++;
          pairs.set(pk, r);
        }
      });
    });
    const players = [...map.values()].sort((a, b) => b.wins - a.wins || b.wins / b.gp - a.wins / a.gp || a.name.localeCompare(b.name));
    const teams = [...pairs.values()].sort((a, b) => b.wins - a.wins || b.gp - a.gp || a.names.join().localeCompare(b.names.join()));
    return { players, teams };
  }
  const pct = (a, b) => b ? Math.round(100 * a / b) + "%" : "–";
  const avg = (a, b) => b ? num(Math.round(a / b)) : "–";

  // ----- views -----
  function button() { return `<button class="small ghost" data-hx="open" id="hx-open" type="button">History</button>`; }
  function note() { return `<p class="hint">Saved in History with today's date.</p>`; }
  function unbacked() { let at = 0; try { at = +localStorage.getItem(BKEY) || 0; } catch (err) { /* ignore */ } return games.filter(isDone).length - at; }
  function award(t, w, d) { return `<div class="hx-award"><span class="hx-an">${t}</span><span class="hx-aw">${w}</span><span class="hx-ad">${d}</span></div>`; }

  function recordsView(done, stats) {
    if (!done.length) return "";
    const items = [];
    const scores = [], margins = [];
    done.forEach(g => {
      const t = totalsOf(g), w = winnersOf(g);
      g.sides.forEach((s, i) => scores.push({ v: t[i], who: sideLabel(s), g }));
      if (w.length === 1 && g.sides.length > 1) {
        const others = t.filter((_, i) => i !== w[0]);
        const runner = g.lowWins ? Math.min(...others) : Math.max(...others);
        margins.push({ v: Math.abs(t[w[0]] - runner), who: sideLabel(g.sides[w[0]]), g });
      }
    });
    const pick = (list, hi) => { const m = hi ? Math.max(...list.map(x => x.v)) : Math.min(...list.map(x => x.v)); return { m, who: list.filter(x => x.v === m) }; };
    const names = who => e([...new Set(who.map(x => x.who))].slice(0, 3).join(", ")) + (new Set(who.map(x => x.who)).size > 3 ? "…" : "");
    const when = who => who.length === 1 ? dayTxt(who[0].g.date) : `${who.length} times`;
    const lowWins = done.every(g => g.lowWins);
    const best = pick(scores, !lowWins), worst = pick(scores, lowWins);
    items.push(award(lowWins ? "Lowest score" : "Highest score", names(best.who), `${num(best.m)} · ${when(best.who)}`));
    items.push(award(lowWins ? "Highest score" : "Lowest score", names(worst.who), `${num(worst.m)} · ${when(worst.who)}`));
    if (margins.length) { const mg = pick(margins, true); items.push(award("Biggest win", names(mg.who), `By ${num(mg.m)} · ${when(mg.who)}`)); }
    const most = f => stats.players.length ? Math.max(...stats.players.map(p => p[f])) : 0;
    const whoOf = (m, f) => e(stats.players.filter(p => p[f] === m).map(p => p.name).slice(0, 3).join(", "));
    const mw = most("wins"), ms = most("bestStreak"), mg2 = most("gp");
    if (stats.players.length) {
      items.push(award("Most wins", mw ? whoOf(mw, "wins") : "–", plural(mw, "win")));
      items.push(award("Longest win streak", ms ? whoOf(ms, "bestStreak") : "–", `${ms} in a row`));
      items.push(award("Most games", whoOf(mg2, "gp"), plural(mg2, "game")));
    }
    if (HX.records) { try { (HX.records(done) || []).forEach(r => items.push(award(e(r[0]), e(r[1]), e(r[2])))); } catch (err) { /* adapter records are optional */ } }
    return `<div class="panel"><h2>Records</h2><div class="hx-awards">${items.join("")}</div></div>`;
  }

  function scorecard(g) {
    const t = totalsOf(g), w = winnersOf(g), run = g.sides.map(() => 0);
    const head = `<tr><th>${e(unitOne[0].toUpperCase() + unitOne.slice(1))}</th>${g.sides.map((s, i) => `<th class="${g.done && w.includes(i) ? "hx-won" : ""}">${e(shortLabel(s))}</th>`).join("")}</tr>`;
    const body = g.rounds.map((r, ri) => {
      r.forEach((v, i) => { run[i] += v; });
      const label = g.labels && g.labels[ri] ? g.labels[ri] : String(ri + 1);
      return `<tr><td>${e(label)}</td>${r.map((v, i) => `<td>${num(v)}${g.rounds.length > 1 ? `<span class="hx-run">${num(run[i])}</span>` : ""}</td>`).join("")}</tr>`;
    }).join("");
    const foot = `<tr class="hx-tot"><td>Total</td>${t.map((v, i) => `<td class="${g.done && w.includes(i) ? "hx-won" : ""}">${num(v)}</td>`).join("")}</tr>`;
    let more = "";
    if (HX.detail) { try { more = HX.detail(g) || ""; } catch (err) { more = ""; } }
    return `<div class="hx-card"><div class="stwrap hx-wrap"><table class="st hx-sc"><thead>${head}</thead><tbody>${body}${foot}</tbody></table></div>${g.rounds.length > 1 ? `<p class="hint">Small numbers are running totals.</p>` : ""}${more}</div>`;
  }

  function logView(list, sel) {
    let rows = list.slice().reverse();
    if (sel) rows = rows.filter(g => g.sides.some(s => s.players.some(n => pkey(n) === sel.k)));
    if (!rows.length) return "";
    const shown = ui.all ? rows : rows.slice(0, 10);
    const items = shown.map(g => {
      const t = totalsOf(g), w = winnersOf(g);
      const order = t.map((_, i) => i).sort((a, b) => (g.lowWins ? t[a] - t[b] : t[b] - t[a]) || a - b);
      const current = g.id === state.hxId;
      const lead = w.map(i => e(sideLabel(g.sides[i]))).join(" &amp; ");
      let status;
      if (g.done) {
        const others = t.filter((_, i) => !w.includes(i));
        const runner = others.length ? (g.lowWins ? Math.min(...others) : Math.max(...others)) : null;
        status = w.length > 1 ? `${lead} tied` : `${lead} won${runner != null ? ` by ${num(Math.abs(t[w[0]] - runner))}` : ""}`;
      } else status = `<span class="hx-tag">${current ? "In progress" : "Unfinished"}</span> after ${plural(g.rounds.length, unitOne, unitMany)}`;
      const open = ui.game === g.id, del = "del-" + g.id;
      return `<div class="hx-game">
        <div class="hx-meta"><b>${e(whenTxt(g.date))}</b><span class="hint">${status}${g.note ? ` · ${e(g.note)}` : ""}</span></div>
        <div class="hx-scores num">${order.map(i => `<span class="${g.done && w.includes(i) ? "hx-win" : ""}">${e(sideLabel(g.sides[i]))} <b>${num(t[i])}</b></span>`).join(" · ")}</div>
        <div class="btnrow hx-btns"><button class="small" type="button" data-hx="game" data-id="${e(g.id)}" id="hx-g-${e(g.id)}">${open ? "Hide scorecard" : "Scorecard"}</button><button class="small" type="button" data-hx="sres" data-id="${e(g.id)}" id="hx-s-${e(g.id)}">${ui.copied === g.id ? "Copied ✓" : "Share"}</button>${!g.done && !current ? `<button class="small" type="button" data-hx="fin" data-id="${e(g.id)}" id="hx-f-${e(g.id)}">${ui.confirm === "fin-" + g.id ? "Tap to finish" : "Mark finished"}</button>` : ""}${current ? "" : `<button class="small danger" type="button" data-hx="del" data-id="${e(g.id)}" id="hx-d-${e(g.id)}">${ui.confirm === del ? "Tap to delete" : "Delete"}</button>`}</div>
        ${open ? scorecard(g) : ""}

    }).join("");
    return `<div class="panel"><h2>${sel ? `${e(sel.name)}'s games` : "Game log"}</h2><div class="hx-log">${items}</div>
      ${rows.length > 10 ? `<button class="small" type="button" data-hx="all" id="hx-all">${ui.all ? "Show fewer" : `Show all ${rows.length} games`}</button>` : ""}</div>`;
  }

  function backupView() {
    return `<div class="panel"><h2>Backup &amp; share</h2>
      <p class="hint">History is stored on this phone only. Clearing site data or switching phones loses it, so back it up now and then.</p>
      <p class="hint">To combine two phones' history, share the backup to the other phone and tap Restore there. Games it already has are skipped.</p>
      <div class="btnrow"><button type="button" data-hx="share" id="hx-share" ${games.length ? "" : "disabled"}>Share backup</button><button type="button" data-hx="download" id="hx-download" ${games.length ? "" : "disabled"}>Download</button><button type="button" data-hx="restore" id="hx-restore">Restore</button></div>
      <input type="file" id="hx-file" accept=".json,application/json" hidden>
      ${ui.msg ? `<p class="hint" role="status">${e(ui.msg)}</p>` : ""}</div>`;
  }

  function view() {
    const back = `<button class="small ghost" type="button" data-hx="back" id="hx-back">Back</button>`;
    const top = `<div class="hx-top"><div><div class="eyebrow">${e(HX.title)}</div><h1>History</h1></div>${back}</div>`;
    if (!games.length) return `<div class="hx">${top}<div class="panel"><h2>No games yet</h2><p class="hint">Every game is saved here as you play, with the date, the ${HX.sideWord || "team"}s and every ${unitOne}'s score.</p></div>${moveView()}${backupView()}</div>`;
    const list = byDate().filter(inRange), stats = career(list), done = list.filter(isDone);
    const sel = ui.sel && stats.players.find(p => p.k === ui.sel);
    const years = [...new Set(games.map(g => new Date(g.date).getFullYear()).filter(y => !isNaN(y)))].sort((a, b) => b - a);
    const opt = (v, l) => `<option value="${v}" ${ui.range === v ? "selected" : ""}>${l}</option>`;
    const range = `<div class="row"><label class="eyebrow" for="hx-range">Showing</label><select id="hx-range" class="grow">${opt("all", "All time")}${opt("d30", "Last 30 days")}${opt("d90", "Last 90 days")}${years.map(y => opt("y" + y, y)).join("")}</select></div>`;
    const nudge = unbacked() >= 5 ? `<div class="hx-nudge"><span class="grow">${plural(unbacked(), "finished game")} since your last backup.</span><button class="small" type="button" data-hx="download" id="hx-nudge">Back up now</button></div>` : "";
    let body;
    if (sel) {
      body = `<div class="panel"><div class="row"><h2 class="grow">${e(sel.name)}</h2><button class="small" type="button" data-hx="player" data-k="" id="hx-everyone">Everyone</button></div>
        <div class="hx-awards">${award("Games", sel.gp, `in ${rangeLabel()}`)}${award("Wins", sel.wins, `${pct(sel.wins, sel.gp)} of games${sel.shared ? `, ${sel.shared} shared` : ""}`)}${award(done.every(g => g.lowWins) ? "Best (lowest)" : "Best score", sel.best == null ? "–" : num(sel.best), "single game")}${award("Average", avg(sel.sum, sel.gp), "per game")}${award("Best streak", sel.bestStreak, "wins in a row")}</div></div>`;
    } else if (!done.length) {
      body = `<div class="panel"><h2>All-time records</h2><p class="hint">No finished games in ${rangeLabel()} yet. Unfinished games are listed below.</p></div>`;
    } else {
      const pl = stats.players, tm = stats.teams;
      body = `<div class="panel"><div><h2>Players</h2><p class="hint">${plural(done.length, "finished game")} in ${rangeLabel()}. Tap a name for their record and games.</p></div>
        ${pl.length ? `<div class="stwrap"><table class="st"><thead><tr><th>Player</th><th>GP</th><th>Wins</th><th>Win %</th><th>Avg</th><th>Best</th></tr></thead><tbody>
          ${pl.map(p => `<tr><td><button class="hx-link" type="button" data-hx="player" data-k="${e(p.k)}">${e(p.name)}</button></td><td>${p.gp}</td><td>${p.wins}</td><td>${pct(p.wins, p.gp)}</td><td>${avg(p.sum, p.gp)}</td><td>${p.best == null ? "–" : num(p.best)}</td></tr>`).join("")}
        </tbody></table></div><p class="hint">GP: games played. Wins include ties. Avg and Best are ${HX.sideWord === "player" ? "the player's" : "the team's"} final score.</p>`
        : `<p class="hint">Only unnamed players so far. Name everyone at the start of a game to track them here.</p>`}</div>
        ${tm.length ? `<div class="panel"><h2>Partnerships</h2><div class="stwrap"><table class="st"><thead><tr><th>Pair</th><th>GP</th><th>Wins</th><th>Win %</th></tr></thead><tbody>${tm.map(r => `<tr><td>${e(r.names.join(" & "))}</td><td>${r.gp}</td><td>${r.wins}</td><td>${pct(r.wins, r.gp)}</td></tr>`).join("")}</tbody></table></div></div>` : ""}
        ${recordsView(done, stats)}`;
    }
    return `<div class="hx">${top}${nudge}${range}${body}${logView(list, sel)}${backupView()}${moveView()}</div>`;
  }

  // ----- backup -----
  function file() {
    const data = JSON.stringify({ app: HX.app, version: 1, exported: new Date().toISOString(), games }, null, 2);
    return new File([data], `${HX.app}-history-${new Date().toISOString().slice(0, 10)}.json`, { type: "application/json" });
  }
  function marked() { try { localStorage.setItem(BKEY, String(games.filter(isDone).length)); } catch (err) { /* ignore */ } }
  function download() {
    const f = file(), a = document.createElement("a");
    a.href = URL.createObjectURL(f); a.download = f.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    marked(); ui.msg = `Downloaded ${f.name}.`;
  }
  async function share() {
    const f = file();
    if (navigator.canShare && navigator.canShare({ files: [f] })) {
      try { await navigator.share({ files: [f], title: `${HX.title} history` }); marked(); ui.msg = "Backup shared."; }
      catch (err) { if (err.name !== "AbortError") ui.msg = "Couldn't share. Try Download instead."; }
    } else { download(); ui.msg += " This browser can't share files, so it was downloaded instead."; }
  }
  function restore(text) {
    let data;
    try { data = JSON.parse(text); } catch (err) { ui.msg = `That file isn't a ${HX.title} backup.`; return; }
    if (data && data.kind === BUNDLE && data.apps) data = Array.isArray(data.apps[HX.app]) ? data.apps[HX.app] : [];
    const list = Array.isArray(data) ? data : data && Array.isArray(data.games) && (!data.app || data.app === HX.app) ? data.games : null;
    if (!list) { ui.msg = `That file isn't a ${HX.title} backup.`; return; }
    ui.msg = merge(list);
  }
  // Adds games this phone doesn't have; a game it has is replaced only by a more complete copy (never the one being played).
  function merge(list) {
    let added = 0, updated = 0, skipped = 0, bad = 0;
    list.forEach(g => {
      if (!valid(g)) { bad++; return; }
      const k = games.findIndex(x => x.id === g.id);
      const copy = JSON.parse(JSON.stringify(g));
      if (isNaN(new Date(copy.date))) copy.date = new Date().toISOString();
      if (k < 0) { games.push(copy); added++; }
      else if (g.id !== state.hxId && (g.done && !games[k].done || g.rounds.length > games[k].rounds.length)) { games[k] = copy; updated++; }
      else skipped++;
    });
    persist();
    return `Added ${plural(added, "game")}.` + (updated ? ` Updated ${updated}.` : "") + (skipped ? ` ${skipped} already here.` : "") + (bad ? ` ${bad} unreadable.` : "");
  }

  // ----- moving History into a Home Screen icon -----
  // On iPhone an app opened from a Home Screen icon keeps its own storage, separate from Safari. All the card apps
  // share Safari's storage, so one Copy there carries every card game's history; Paste in an icon takes this game's part.
  const BUNDLE = "card-games-history";
  const CARD_APPS = ["hand-foot", "hearts", "skyjo", "cribbage", "spades", "euchre", "pitch", "casino", "flip7", "up-down-river", "presidents", "mao", "card-golf"];
  const iOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
  const standalone = () => navigator.standalone === true || !!(window.matchMedia && matchMedia("(display-mode: standalone)").matches);
  const here = () => (location.host + location.pathname).replace(/index\.html$/, "");
  function bundle() {
    const apps = {}; let n = 0, k = 0;
    CARD_APPS.forEach(id => {
      let a = [];
      try { a = JSON.parse(localStorage.getItem(id + "-history-v1") || "[]"); } catch (err) { a = []; }
      if (Array.isArray(a) && a.length) { apps[id] = a; n += a.length; k++; }
    });
    return { text: JSON.stringify({ kind: BUNDLE, version: 1, exported: new Date().toISOString(), apps }), games: n, apps: k };
  }
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (err) { /* older browsers: copy from a hidden box */ }
    const t = document.createElement("textarea");
    t.value = text; t.setAttribute("readonly", ""); t.style.cssText = "position:fixed;top:0;left:0;opacity:0";
    document.body.appendChild(t); t.select(); t.setSelectionRange(0, text.length);
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
    t.remove();
    return ok;
  }
  async function copyAll() {
    const b = bundle(), app = standalone();
    if (!b.games) { ui.mmsg = app ? "There are no games in this app's History yet." : "No card game History is saved in Safari on this phone. If you play from a game's own Home Screen icon, its History is in that icon: open it, tap History, then Copy History."; return; }
    ui.mmsg = await copyText(b.text)
      ? app ? `Copied ${plural(b.games, "game")}. Now open Card Night or the other Home Screen icon and tap Paste History.`
        : `Copied ${plural(b.games, "game")} from ${plural(b.apps, "card app")}. Now open the Home Screen icon or Card Night and tap Paste History.`
      : "Couldn't copy on this browser. Use Share backup instead, then Restore in the other app.";
  }
  async function pasteFromSafari() {
    let text = "";
    try { text = await navigator.clipboard.readText(); } catch (err) { text = ""; }
    if (!text) { ui.pasteBox = true; ui.mmsg = "Long-press the box, tap Paste, then tap Add games."; return; }
    take(text);
  }
  function take(text) {
    let data = null;
    try { data = JSON.parse(text); } catch (err) { data = null; }
    if (data && data.kind === BUNDLE && data.apps && typeof data.apps === "object") {
      const list = data.apps[HX.app];
      ui.pasteBox = false;
      ui.mmsg = Array.isArray(list) && list.length ? merge(list) : `What you copied has no ${HX.title} games.`;
    } else if (data && (data.app === HX.app || Array.isArray(data)) && (Array.isArray(data) || Array.isArray(data.games))) {
      ui.pasteBox = false; ui.mmsg = merge(Array.isArray(data) ? data : data.games);
    } else ui.mmsg = "That isn't card game history. Copy it first: in Safari, History → Copy for Home Screen; in another Home Screen icon, History → Copy History.";
  }
  function moveView() {
    if (!iOS) return "";
    const msg = ui.mmsg ? `<p class="hint" role="status">${e(ui.mmsg)}</p>` : "";
    if (!standalone()) return `<div class="panel"><h2>Home Screen icon</h2>
      <p class="hint">An app opened from a Home Screen icon keeps its own History, separate from Safari. To bring your games over, tap Copy here, then open the Home Screen icon or Card Night and tap Paste History. One Copy carries every card game's history.</p>
      <div class="btnrow"><button type="button" data-hx="mcopy" id="hx-mcopy">Copy for Home Screen</button></div>${msg}</div>`;
    return `<div class="panel"><h2>Move History</h2>
      <p class="hint">This Home Screen app keeps its own History, separate from Safari and from other Home Screen icons.</p>
      <p class="hint">To move these games into Card Night or another icon, tap Copy History, then open it there and tap Paste History.</p>
      <p class="hint">To bring in games you played in Safari, open ${e(here())} in Safari, tap History, then Copy for Home Screen. Then come back here and tap Paste History.</p>
      <div class="btnrow"><button type="button" data-hx="mcopy" id="hx-mcopy">Copy History</button><button type="button" data-hx="mpaste" id="hx-mpaste">Paste History</button></div>
      ${ui.pasteBox ? `<textarea id="hx-mtext" class="hx-paste" rows="3" placeholder="Long-press here and tap Paste" aria-label="Copied history"></textarea><div class="btnrow"><button type="button" data-hx="mpaste2" id="hx-mpaste2">Add games</button></div>` : ""}${msg}</div>`;
  }

  // ----- sharing a result as text (group chats) -----
  function resultText(g) {
    const t = totalsOf(g), w = g.done ? winnersOf(g) : [];
    const better = (a, b) => g.lowWins ? a < b : a > b;
    const order = t.map((_, i) => i).sort((a, b) => (g.lowWins ? t[a] - t[b] : t[b] - t[a]) || a - b);
    const rest = order.filter(i => !w.includes(i));
    const lines = [`${HX.title} · ${dayTxt(g.date)}`];
    if (!g.done) lines.push(`Standings after ${plural(g.rounds.length, unitOne, unitMany)}`);
    order.filter(i => w.includes(i)).forEach(i => lines.push(`🏆 ${sideLabel(g.sides[i])} ${num(t[i])}`));
    rest.forEach(i => {
      const pos = w.length + 1 + rest.filter(j => better(t[j], t[i])).length, tied = rest.some(j => j !== i && t[j] === t[i]);
      lines.push(`${tied ? "T" : ""}${pos}. ${sideLabel(g.sides[i])} ${num(t[i])}`);
    });
    const foot = [g.done ? plural(g.rounds.length, unitOne, unitMany) : "", g.note || ""].filter(Boolean).join(" · ");
    if (foot) lines.push(foot);
    const solo = w.length === 1 && g.sides[w[0]].players.length === 1 ? g.sides[w[0]].players[0] : "";
    if (solo && !guest(solo)) {
      const p = career(byDate().filter(x => String(x.date) <= String(g.date))).players.find(x => x.k === pkey(solo));
      if (p && p.streak >= 2) lines.push(`🔥 ${p.name} has won ${p.streak} in a row`);
    }
    return lines.join("\n");
  }
  async function shareResult(id) {
    const g = games.find(x => x.id === id); if (!g) return;
    const text = resultText(g);
    if (navigator.share) {
      try { await navigator.share({ text }); return; } catch (err) { if (err.name === "AbortError") return; }
    }
    if (!(await copyText(text))) return;
    ui.copied = id; render();
    setTimeout(() => { if (ui.copied === id) { ui.copied = null; render(); } }, 3000);
  }
  function shareButton(label, cls) {
    const id = state.hxId;
    if (!id || !games.some(g => g.id === id)) return "";
    return `<button class="${cls || "small"}" type="button" data-hx="sres" data-id="${e(id)}" id="hx-sres">${ui.copied === id ? "Copied ✓" : e(label || "Share result")}</button>`;
  }
  function saved() { return `<div class="hx-saved"><span style="opacity:.9">This game is saved in History.</span>${shareButton()}</div>`; }

  // ----- events -----
  function confirmThen(key, fn) {
    if (ui.confirm === key) { clearTimeout(ui.timer); ui.confirm = null; fn(); return; }
    ui.confirm = key; render();
    clearTimeout(ui.timer);
    ui.timer = setTimeout(() => { ui.confirm = null; if (ui.open) render(); }, 3500);
  }
  document.addEventListener("click", ev => {
    const b = ev.target.closest("[data-hx]"); if (!b) return;
    const a = b.dataset.hx;
    if (a === "open") { ui.open = true; ui.msg = ""; render(); window.scrollTo(0, 0); }
    else if (a === "back") { ui.open = false; ui.sel = null; ui.game = null; render(); window.scrollTo(0, 0); }
    else if (a === "game") { ui.game = ui.game === b.dataset.id ? null : b.dataset.id; render(); }
    else if (a === "del") confirmThen("del-" + b.dataset.id, () => { games = games.filter(g => g.id !== b.dataset.id); persist(); render(); });
    // an unfinished game that isn't being played (abandoned, or copied in from another phone or icon) can be closed out: best total wins
    else if (a === "fin") confirmThen("fin-" + b.dataset.id, () => {
      const g = games.find(x => x.id === b.dataset.id); if (!g || g.done || g.id === state.hxId) return;
      const t = totalsOf(g), best = g.lowWins ? Math.min(...t) : Math.max(...t);
      g.done = true; g.winners = t.map((_, i) => i).filter(i => t[i] === best); g.updated = new Date().toISOString();
      persist(); render();
    });
    else if (a === "all") { ui.all = !ui.all; render(); }
    else if (a === "player") { ui.sel = b.dataset.k || null; ui.all = false; render(); window.scrollTo(0, 0); }
    else if (a === "download") { download(); render(); }
    else if (a === "share") share().then(render);
    else if (a === "restore") { const f = document.getElementById("hx-file"); if (f) f.click(); }
    else if (a === "sres") shareResult(b.dataset.id);
    else if (a === "mcopy") copyAll().then(render);
    else if (a === "mpaste") pasteFromSafari().then(render);
    else if (a === "mpaste2") { const t = document.getElementById("hx-mtext"); take(t ? t.value : ""); render(); }
  });
  document.addEventListener("change", ev => {
    if (ev.target.id === "hx-range") { ui.range = ev.target.value; ui.sel = null; render(); }
    if (ev.target.id === "hx-file" && ev.target.files && ev.target.files[0]) ev.target.files[0].text().then(restore, () => { ui.msg = "Couldn't read that file."; }).then(render);
  });

  return { sync, view, button, note, saved, shareButton, isOpen: () => ui.open, games: () => games };
})();
// Wrap the app's own save() and render(): every save keeps the archive current, and History takes over the screen while open.
{
  const appSave = save, appRender = render;
  save = function () { hx.sync(); return appSave.apply(this, arguments); };
  render = function () {
    if (hx.isOpen()) { document.getElementById("app").innerHTML = hx.view(); return; }
    return appRender.apply(this, arguments);
  };
}
// A game already on this phone when History arrived is saved right away (dated now).
hx.sync(); save();
/* hx:js:end */
render();
keepAwake();
</script>
